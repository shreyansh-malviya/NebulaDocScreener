# Render blueprint — deploys the LITE (ONNX-only) backend on the free tier.
# See backend/README.md "Deploy" for the memory profile (face is excluded to fit 512 MB).
services:
  - type: web
    name: nebula-screening
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LEDGER_SECRET
        generateValue: true
      - key: STATION_ID
        value: SSB-DEMO-LANE-1
      # Set this in the Render dashboard to a MongoDB Atlas URI to persist across spin-downs.
      # Leave unset to run on the in-memory store.
      - key: MONGODB_URI
        sync: false
